<svg viewBox="0 0 940 560" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agent 沙箱品类坐标系：横轴为隔离强度，纵轴为授权粒度，nono 位于共享内核且粒度最细的象限">
  <defs>
    <marker id="spL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="spD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>
  <style>
    .grid   { stroke: #e7e5e4; stroke-width: 1; }
    .axis   { stroke: #57534e; stroke-width: 1.4; }
    .dot    { fill: #f5f5f4; stroke: #57534e; stroke-width: 1.2; }
    .dot-hero { fill: #f97316; stroke: #c2410c; stroke-width: 1.6; }
    .lbl    { fill: #57534e; font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; }
    .lbl-hero { fill: #b45309; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; }
    .mono   { fill: #78716c; font-family: 'SF Mono', 'Cascadia Code', monospace; font-size: 9.5px; }
    .region { fill: #78716c; font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-style: italic; }
    .combo  { stroke: #b45309; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; marker-end: url(#spL); }
    @media (prefers-color-scheme: dark) {
      .grid   { stroke: #44403c; }
      .axis   { stroke: #a8a29e; }
      .dot    { fill: #292524; stroke: #a8a29e; }
      .dot-hero { fill: #f97316; stroke: #fb923c; }
      .lbl    { fill: #a8a29e; }
      .lbl-hero { fill: #f97316; }
      .mono   { fill: #a8a29e; }
      .region { fill: #a8a29e; }
      .combo  { stroke: #d97706; marker-end: url(#spD); }
    }
  </style>

  <!-- 网格 -->
  <line class="grid" x1="150" y1="60" x2="150" y2="470"/>
  <line class="grid" x1="330" y1="60" x2="330" y2="470"/>
  <line class="grid" x1="510" y1="60" x2="510" y2="470"/>
  <line class="grid" x1="690" y1="60" x2="690" y2="470"/>
  <line class="grid" x1="870" y1="60" x2="870" y2="470"/>
  <line class="grid" x1="60" y1="140" x2="900" y2="140"/>
  <line class="grid" x1="60" y1="250" x2="900" y2="250"/>
  <line class="grid" x1="60" y1="360" x2="900" y2="360"/>

  <!-- 坐标轴 -->
  <line class="axis" x1="60" y1="470" x2="900" y2="470"/>
  <line class="axis" x1="60" y1="60" x2="60" y2="470"/>

  <!-- 轴标签 -->
  <text class="lbl" x="470" y="500" text-anchor="middle">隔离强度（对内核 / 硬件边界的依赖）→</text>
  <text class="lbl" x="36" y="265" text-anchor="middle" transform="rotate(-90 36 265)">授权粒度（上：单次调用级　下：整机级）→</text>
  <text class="region" x="480" y="90" text-anchor="middle">治理运行时：壳 + 锁</text>
  <text class="region" x="250" y="90" text-anchor="middle">能力沙箱</text>
  <text class="region" x="480" y="420" text-anchor="middle">隔离沙箱（执行沙箱）</text>

  <!-- 数据点 -->
  <circle class="dot" cx="150" cy="385" r="6"/>
  <text class="lbl" x="150" y="410" text-anchor="middle">Docker（默认配置）</text>

  <circle class="dot" cx="430" cy="385" r="6"/>
  <text class="lbl" x="430" y="410" text-anchor="middle">gVisor（用户态内核）</text>

  <circle class="dot" cx="700" cy="360" r="6"/>
  <text class="lbl" x="700" y="385" text-anchor="middle">Firecracker · E2B</text>
  <text class="mono" x="700" y="398" text-anchor="middle">microVM，约 80–125ms 启动</text>

  <circle class="dot" cx="620" cy="130" r="6"/>
  <text class="lbl" x="620" y="112" text-anchor="middle">OpenShell</text>
  <text class="mono" x="620" y="148" text-anchor="middle">容器 / VM 壳内 OPA 逐请求裁决</text>

  <circle class="dot-hero" cx="150" cy="115" r="7"/>
  <text class="lbl-hero" x="150" y="98" text-anchor="middle">nono</text>
  <text class="mono" x="150" y="76" text-anchor="middle">共享内核 · 粒度最细 · 3–10μs</text>

  <!-- 组合路径 -->
  <path class="combo" d="M 157 112 C 260 100 340 130 430 168"/>
  <text class="lbl" x="368" y="196">官方推荐组合：能力沙箱 + 外层容器 / microVM</text>
</svg>
