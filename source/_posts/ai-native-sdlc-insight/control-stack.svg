<svg viewBox="0 0 720 416" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="csArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" class="mk"/>
    </marker>
  </defs>

  <style>
    .box    { fill: #fafaf9; stroke: #e7e5e4; stroke-width: 1; }
    .hdr    { stroke-width: 0; }
    .hdr-h  { fill: #0f766e; }
    .hdr-c  { fill: #57534e; }
    .hdr-a  { fill: #b45309; }
    .hdr-d  { fill: #991b1b; }
    .h-t    { font-family: system-ui,-apple-system,sans-serif; font-size: 11px; font-weight: 650; fill: #fff; }
    .b-t    { font-family: system-ui,-apple-system,sans-serif; font-size: 9.5px; fill: #57534e; }
    .tag    { font-family: 'SF Mono','Cascadia Code',monospace; font-size: 8.5px; fill: #a8a29e; }
    .ax     { stroke: #a8a29e; stroke-width: 1.5; fill: none; }
    .ax-t   { font-family: system-ui,-apple-system,sans-serif; font-size: 10px; font-weight: 600; fill: #78716c; }
    .chev   { fill: #a8a29e; }
    .note   { font-family: system-ui,-apple-system,sans-serif; font-size: 9.5px; fill: #78716c; }
    .note-b { font-family: system-ui,-apple-system,sans-serif; font-size: 9.5px; font-weight: 600; fill: #b45309; }
    .mk     { fill: #a8a29e; }

    @media (prefers-color-scheme: dark) {
      .box    { fill: #1c1917; stroke: #44403c; }
      .b-t    { fill: #a8a29e; }
      .tag    { fill: #78716c; }
      .ax     { stroke: #57534e; }
      .ax-t   { fill: #a8a29e; }
      .chev   { fill: #57534e; }
      .note   { fill: #78716c; }
      .note-b { fill: #d97706; }
      .mk     { fill: #57534e; }
    }
  </style>

  <!-- left axis -->
  <line x1="40" y1="388" x2="40" y2="44" class="ax" marker-end="url(#csArrow)"/>
  <text transform="rotate(-90 24 216)" x="24" y="216" text-anchor="middle" class="ax-t">约束强度递增</text>

  <!-- L4 human -->
  <rect x="250" y="36" width="220" height="76" rx="8" class="box"/>
  <rect x="250" y="36" width="220" height="22" rx="8" class="hdr hdr-h"/>
  <rect x="250" y="46" width="220" height="12" class="hdr hdr-h"/>
  <text x="360" y="51" text-anchor="middle" class="h-t">人类判断 · 决策层</text>
  <text x="264" y="76" class="b-t">门禁处审批——审意图与风险，而非逐行审代码</text>
  <text x="264" y="94" class="b-t">高风险升级至技术负责人</text>
  <text x="456" y="70" text-anchor="end" class="tag">每门禁</text>

  <!-- L3 context -->
  <rect x="190" y="128" width="340" height="76" rx="8" class="box"/>
  <rect x="190" y="128" width="340" height="22" rx="8" class="hdr hdr-c"/>
  <rect x="190" y="138" width="340" height="12" class="hdr hdr-c"/>
  <text x="360" y="143" text-anchor="middle" class="h-t">上下文层 · AGENTS.md</text>
  <text x="204" y="168" class="b-t">「新员工手册」：命令、约定、架构、易错点</text>
  <text x="204" y="186" class="b-t">每次会话载入 · 全团队共享 · 像代码一样评审</text>
  <text x="516" y="162" text-anchor="end" class="tag">每会话</text>

  <!-- L2 advisory -->
  <rect x="130" y="220" width="460" height="76" rx="8" class="box"/>
  <rect x="130" y="220" width="460" height="22" rx="8" class="hdr hdr-a"/>
  <rect x="130" y="230" width="460" height="12" class="hdr hdr-a"/>
  <text x="360" y="235" text-anchor="middle" class="h-t">建议性控制 · 技能（SKILL.md）</text>
  <text x="144" y="260" class="b-t">制度知识编码为可触发、可版本化的文件，编码时应用政策</text>
  <text x="144" y="278" class="b-t">让违规变少（但非不可能）· 政策负责人签收变更</text>
  <text x="576" y="254" text-anchor="end" class="tag">每相关任务</text>

  <!-- L1 deterministic -->
  <rect x="70" y="312" width="580" height="76" rx="8" class="box"/>
  <rect x="70" y="312" width="580" height="22" rx="8" class="hdr hdr-d"/>
  <rect x="70" y="322" width="580" height="12" class="hdr hdr-d"/>
  <text x="360" y="327" text-anchor="middle" class="h-t">确定性控制 · 权限 / 护栏 / CI 门禁 / 分支保护</text>
  <text x="84" y="352" class="b-t">每次匹配动作必执行 · 违规接近不可能</text>
  <text x="84" y="370" class="b-t">拒绝必须自解释：给出原因与获得批准的路径</text>
  <text x="636" y="346" text-anchor="end" class="tag">每动作</text>

  <!-- chevrons -->
  <path d="M 352 124 l 8 10 l 8 -10 z" class="chev" transform="rotate(180 360 129)"/>
  <path d="M 352 216 l 8 10 l 8 -10 z" class="chev" transform="rotate(180 360 221)"/>
  <path d="M 352 308 l 8 10 l 8 -10 z" class="chev" transform="rotate(180 360 313)"/>

  <!-- bottom note -->
  <text x="360" y="406" text-anchor="middle" class="note">职责分离底线：写代码的 Agent 不能批准代码，提出修复的 Agent 不能批准修复</text>
</svg>
