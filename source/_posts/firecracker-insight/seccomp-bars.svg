<svg viewBox="0 0 620 240" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="s" x="-2%" y="-10%" width="104%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#78716c" flood-opacity="0.05"/>
    </filter>
  </defs>

  <style>
    .title    { font-family: system-ui,-apple-system,sans-serif; font-size: 14px; font-weight: 650; fill: #292524; }
    .sub      { font-family: system-ui,-apple-system,sans-serif; font-size: 10.5px; fill: #78716c; }
    .name     { font-family: system-ui,-apple-system,sans-serif; font-size: 12px; font-weight: 600; fill: #292524; }
    .ctx      { font-family: system-ui,-apple-system,sans-serif; font-size: 10px; fill: #a8a29e; }
    .count    { font-family: system-ui,-apple-system,sans-serif; font-size: 22px; font-weight: 700; }
    .unit     { font-family: system-ui,-apple-system,sans-serif; font-size: 11px; fill: #78716c; }
    .risk     { font-family: system-ui,-apple-system,sans-serif; font-size: 10px; font-weight: 550; }
    .sep      { stroke: #e7e5e4; stroke-width: .8; }
    .bar-bg   { fill: #f5f5f4; }
    .c-docker { fill: #a8a29e; }
    .c-api    { fill: #57534e; }
    .c-vmm    { fill: #44403c; }
    .c-vcpu   { fill: #c2410c; }
    .bar-docker { fill: #e7e5e4; }
    .bar-api    { fill: #a8a29e; }
    .bar-vmm    { fill: #78716c; }
    .bar-vcpu   { fill: #c2410c; }
    .dot-bg  { fill: #f5f5f4; stroke: #d6d3d1; stroke-width: 1; }
    .dot-api { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1; }
    .dot-vcpu{ fill: #fffbeb; stroke: #fbbf24; stroke-width: 1; }
    .risk-docker { fill: #a8a29e; }
    .risk-api    { fill: #64748b; }
    .risk-vcpu   { fill: #b45309; }

    @media (prefers-color-scheme: dark) {
      .title    { fill: #e7e5e4; }
      .sub      { fill: #a8a29e; }
      .name     { fill: #e7e5e4; }
      .ctx      { fill: #78716c; }
      .unit     { fill: #a8a29e; }
      .sep      { stroke: #44403c; }
      .bar-bg   { fill: #292524; }
      .c-docker { fill: #78716c; }
      .c-api    { fill: #d6d3d1; }
      .c-vmm    { fill: #e7e5e4; }
      .c-vcpu   { fill: #f97316; }
      .bar-docker { fill: #44403c; }
      .bar-api    { fill: #78716c; }
      .bar-vmm    { fill: #a8a29e; }
      .bar-vcpu   { fill: #f97316; }
      .dot-bg  { fill: #292524; stroke: #57534e; }
      .dot-api { fill: #1e293b; stroke: #475569; }
      .dot-vcpu{ fill: #2d1f0c; stroke: #92400e; }
      .risk-docker { fill: #78716c; }
      .risk-api    { fill: #94a3b8; }
      .risk-vcpu   { fill: #f97316; }
    }
  </style>

  <text x="20" y="26" class="title">seccomp 系统调用白名单对比</text>
  <text x="20" y="45" class="sub">允许的 syscall 数量 · 越少攻击面越小</text>

  <!-- Row 1: Docker -->
  <text x="20" y="82" class="name">Docker 默认</text>
  <text x="130" y="82" class="ctx">所有容器共享内核</text>
  <text x="380" y="86" text-anchor="end" class="count c-docker">300+</text>
  <text x="386" y="82" class="unit">syscalls</text>
  <rect x="20" y="97" width="540" height="6" class="bar-docker" rx="3"/>
  <circle cx="588" cy="80" r="6" class="dot-bg"/>
  <text x="600" y="84" class="risk risk-docker">高攻击面</text>

  <line x1="20" y1="118" x2="620" y2="118" class="sep" stroke-dasharray="4,3"/>

  <!-- Row 2: API Server -->
  <text x="20" y="152" class="name">API Server</text>
  <text x="130" y="152" class="ctx">Firecracker 线程</text>
  <text x="380" y="156" text-anchor="end" class="count c-api">40</text>
  <text x="386" y="152" class="unit">syscalls</text>
  <rect x="20" y="167" width="72" height="6" class="bar-api" rx="3"/>
  <rect x="92" y="167" width="468" height="6" class="bar-bg" rx="3"/>
  <circle cx="588" cy="150" r="5" class="dot-api"/>
  <text x="600" y="154" class="risk risk-api">中低</text>

  <!-- Row 3: VMM -->
  <text x="20" y="196" class="name">VMM</text>
  <text x="130" y="196" class="ctx">Firecracker 线程</text>
  <text x="380" y="200" text-anchor="end" class="count c-vmm">30</text>
  <text x="386" y="196" class="unit">syscalls</text>
  <rect x="20" y="211" width="54" height="6" class="bar-vmm" rx="3"/>
  <rect x="74" y="211" width="486" height="6" class="bar-bg" rx="3"/>
  <circle cx="588" cy="194" r="5" class="dot-api"/>
  <text x="600" y="198" class="risk risk-api">低</text>

  <!-- Row 4: vCPU -->
  <text x="20" y="238" class="name">vCPU</text>
  <text x="130" y="238" class="ctx">Firecracker 线程</text>
  <text x="380" y="242" text-anchor="end" class="count c-vcpu">10</text>
  <text x="386" y="238" class="unit">syscalls</text>
  <rect x="20" y="253" width="18" height="6" class="bar-vcpu" rx="3"/>
  <rect x="38" y="253" width="522" height="6" class="bar-bg" rx="3"/>
  <circle cx="588" cy="236" r="5" class="dot-vcpu"/>
  <text x="600" y="240" class="risk risk-vcpu">极低</text>
</svg>
